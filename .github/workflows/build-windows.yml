<name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore StrohmayerTweaks.sln

      - name: Build
        run: dotnet build StrohmayerTweaks.sln -c Release --no-restore

      - name: Test
        run: dotnet test StrohmayerTweaks.sln -c Release --no-build --verbosity normal

      - name: Publish (win-x64, self-contained)
        run: >
          dotnet publish src/StrohmayerTweaks.App/StrohmayerTweaks.App.csproj
          -c Release -r win-x64 --self-contained true -o publish

      - name: Create ZIP
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath Strohmayer-Tweaks-Windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Strohmayer-Tweaks-Windows-x64
          path: Strohmayer-Tweaks-Windows-x64.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Strohmayer-Tweaks-Windows-x64
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "${{ github.ref_name }}" Strohmayer-Tweaks-Windows-x64.zip
          --repo "${{ github.repository }}" --title "Strohmayer Tweaks ${{ github.ref_name }}" --generate-notes
